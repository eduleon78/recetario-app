<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Recetario</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>🍳 Mi Recetario</h1>
      <p class="subtitle">Colección personal de recetas deliciosas y fáciles</p>
      
      <input type="text" id="search-input" placeholder="Buscar por receta o ingrediente...">
      
      <!-- Filtros por categoría -->
      <nav id="category-filters" class="category-bar"></nav>
    </div>
  </header>

  <main>
    <section id="recipe-list" class="recipe-grid"></section>
  </main>

  <footer>
  <div class="footer-content">
    <p>Hecho con ❤️ y Vanilla JavaScript | Recetario Personal</p>
    <div class="social-links">
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://x.com" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
        <i class="fab fa-x-twitter"></i>
      </a>
      <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <i class="fab fa-linkedin-in"></i>
      </a>
    </div>
  </div>
</footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
